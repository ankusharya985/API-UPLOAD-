<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YT Admin — 7 Channels</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0f;color:#f4f5f7;font-family:Inter,system-ui,Arial}.wrap{max-width:1100px;margin:auto;padding:22px 16px 55px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;gap:11px;align-items:center}.logo{width:45px;height:45px;border-radius:13px;background:#fff;color:#111;display:grid;place-items:center;font-size:22px}.brand h1{font-size:22px;margin:0}.brand p{font-size:12px;color:#8f99a5;margin:3px 0}
.btn{border:0;border-radius:11px;padding:11px 15px;background:#ff3158;color:white;font-weight:800;cursor:pointer}.btn.dark{background:#20252c}.btn:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:1fr 1.55fr;gap:16px}.card{background:#12161b;border:1px solid #252b33;border-radius:18px;padding:18px}h2{font-size:17px;margin:0 0 14px}.muted{color:#8f99a5;font-size:12px}
.channels{display:grid;gap:9px}.ch{display:flex;align-items:center;gap:10px;padding:11px;background:#171c22;border:1px solid #242b33;border-radius:13px}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#242a31}.chmain{min-width:0;flex:1}.chname{font-weight:750;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{font-size:10px;padding:4px 7px;border-radius:99px;background:#252b33;color:#aab3bd}.pill.on{background:#0d2a19;color:#65e695}.switch{width:40px;height:23px;border-radius:99px;background:#343b44;padding:3px;cursor:pointer}.knob{width:17px;height:17px;border-radius:50%;background:#fff;transition:.15s}.switch.on{background:#22c55e}.switch.on .knob{transform:translateX(17px)}
.connect{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:13px}.connect button{padding:10px;border:1px dashed #3b444f;border-radius:11px;background:#0e1216;color:#dce1e6;cursor:pointer}
.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border-radius:10px;border:1px solid #303740;background:#0c0f13;color:#fff;font:inherit}.field textarea{min-height:115px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.file{border:1px dashed #3a434d;border-radius:11px;padding:10px;background:#0d1115}.file input{padding:0;border:0}.preview{display:none;max-width:100%;max-height:150px;border-radius:9px;margin-top:8px}.selected{font-size:12px;color:#aeb7c1;margin:5px 0}.actions{display:flex;gap:8px}.progress{height:8px;background:#292f37;border-radius:99px;overflow:hidden;margin-top:14px;display:none}.bar{height:100%;width:0;background:#ff3158}.msg{margin-top:12px;padding:11px;border-radius:11px;font-size:12px;display:none}.ok{background:#0d2517;color:#7bea9d}.err{background:#2b1118;color:#ff9baa}.result{padding:8px 0;border-bottom:1px solid #252b33}.result a{color:#8bc7ff;text-decoration:none}.empty{padding:18px;text-align:center;border:1px dashed #303842;border-radius:12px;color:#8f99a5;font-size:12px}
@media(max-width:780px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}header{align-items:flex-start}}
</style></head><body><div class="wrap">
<header><div class="brand"><div class="logo">▶</div><div><h1>YT Admin</h1><p>7-channel publishing dashboard</p></div></div><button class="btn dark" onclick="loadChannels()">Refresh</button></header>
<div class="grid"><section class="card"><h2>YouTube Channels</h2><div class="connect" id="connectGrid"></div><div class="channels" id="channels"><div class="empty">Loading channels…</div></div><div class="muted" style="margin-top:12px">Turn ON only the channels that should receive your next upload.</div></section>
<section class="card"><h2>Publish Video</h2><form id="form">
<div class="field"><label>Video *</label><div class="file"><input id="video" name="video" type="file" accept="video/*" required></div><div class="selected" id="videoInfo"></div></div>
<div class="field"><label>Thumbnail</label><div class="file"><input id="thumb" name="thumbnail" type="file" accept="image/*"></div><img id="preview" class="preview"></div>
<div class="field"><label>Title *</label><input id="title" name="title" maxlength="100" required placeholder="YouTube title"><div class="muted" style="text-align:right"><span id="count">0</span>/100</div></div>
<div class="field"><label>Description</label><textarea name="description" placeholder="Description…"></textarea></div>
<div class="row"><div class="field"><label>Tags</label><input name="tags" placeholder="music, hindi, official"></div><div class="field"><label>Visibility</label><select name="privacy"><option value="private">Private</option><option value="unlisted">Unlisted</option><option value="public">Public</option></select></div></div>
<div class="actions"><button class="btn" id="upload" type="submit">Publish to Enabled Channels</button><button class="btn dark" type="reset">Reset</button></div>
<div class="progress" id="progress"><div class="bar" id="bar"></div></div><div class="muted" id="progressText"></div><div class="msg" id="msg"></div>
</form></section></div></div>
<script>
const $=id=>document.getElementById(id);
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function loadChannels(){const r=await fetch("/api/channels",{cache:"no-store"}),d=await r.json();$("connectGrid").innerHTML=Array.from({length:7},(_,i)=>`<button onclick="location.href='/auth/${i+1}'">＋ Connect Channel ${i+1}</button>`).join("");$("channels").innerHTML=d.channels.map(c=>{const img=c.thumbnail?`<img class="avatar" src="${esc(c.thumbnail)}">`:`<div class="avatar"></div>`;if(!c.connected)return `<div class="ch">${img}<div class="chmain"><div class="chname">Channel ${c.slot}</div><div class="muted">Not connected</div></div><span class="pill">EMPTY</span></div>`;return `<div class="ch">${img}<div class="chmain"><div class="chname">${esc(c.title)}</div><div class="muted">Slot ${c.slot}</div></div><span class="pill ${c.enabled?'on':''}">${c.enabled?'ON':'OFF'}</span><div class="switch ${c.enabled?'on':''}" onclick="toggle(${c.slot},${!c.enabled})"><div class="knob"></div></div></div>`}).join("")}
async function toggle(slot,enabled){await fetch(`/api/channels/${slot}/toggle`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled})});loadChannels()}
$("title").oninput=()=> $("count").textContent=$("title").value.length;
$("video").onchange=()=>{const f=$("video").files[0];$("videoInfo").textContent=f?`${f.name} • ${(f.size/1024/1024).toFixed(1)} MB`:""};
$("thumb").onchange=()=>{const f=$("thumb").files[0];if(!f){$("preview").style.display="none";return}$("preview").src=URL.createObjectURL(f);$("preview").style.display="block"};
$("form").onsubmit=e=>{e.preventDefault();const btn=$("upload"),pr=$("progress"),bar=$("bar"),pt=$("progressText"),msg=$("msg");btn.disabled=true;pr.style.display="block";bar.style.width="0%";msg.style.display="none";pt.textContent="Uploading…";const x=new XMLHttpRequest();x.open("POST","/api/upload");x.upload.onprogress=e=>{if(e.lengthComputable){let p=Math.round(e.loaded/e.total*100);bar.style.width=p+"%";pt.textContent=`Sending video… ${p}%`}};x.onload=()=>{btn.disabled=false;try{const d=JSON.parse(x.responseText);if(!d.results)throw Error(d.error||"Upload failed.");bar.style.width="100%";pt.textContent="Finished";msg.className="msg ok";msg.style.display="block";msg.innerHTML=d.results.map(r=>r.success?`<div class="result">✅ <b>${esc(r.title)}</b> — uploaded${r.thumbnailUploaded?" + thumbnail":""}<br><a href="${r.url}" target="_blank">Open on YouTube →</a></div>`:`<div class="result">❌ <b>${esc(r.title)}</b> — ${esc(r.error)}</div>`).join("")}catch(err){msg.className="msg err";msg.style.display="block";msg.textContent=err.message}};x.onerror=()=>{btn.disabled=false;msg.className="msg err";msg.style.display="block";msg.textContent="Network error."};x.send(new FormData($("form")))};
loadChannels();
</script></body></html>
