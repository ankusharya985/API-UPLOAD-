<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>YT Admin</title><style>
body{margin:0;background:#101010;color:#eee;font-family:system-ui}main{max-width:700px;margin:30px auto;padding:20px}.card{background:#191919;border:1px solid #333;border-radius:16px;padding:20px;margin:18px 0}label{display:block;margin:14px 0 6px;font-weight:700}input,textarea,select{width:100%;padding:11px;box-sizing:border-box;background:#0d0d0d;color:#fff;border:1px solid #444;border-radius:9px}textarea{min-height:120px}button{padding:12px 18px;border:0;border-radius:9px;font-weight:700;cursor:pointer}.connect{background:#fff}.publish{background:#f03;color:#fff;width:100%;margin-top:18px}.ok{color:#6e9}.err{color:#f77}a{color:#7bf}</style></head><body><main><h1>🎬 YT Admin</h1><p>Upload directly to YouTube.</p><div class="card"><button class="connect" onclick="location.href='/auth'">🔗 Connect YouTube</button><p id="status">Checking…</p></div><div class="card"><form id="f"><label>Video *</label><input name="video" type="file" accept="video/*" required><label>Thumbnail</label><input name="thumbnail" type="file" accept="image/*"><label>Title *</label><input name="title" maxlength="100" required><label>Description</label><textarea name="description"></textarea><label>Tags</label><input name="tags" placeholder="music, official, song"><label>Visibility</label><select name="privacy"><option value="private">Private</option><option value="unlisted">Unlisted</option><option value="public">Public</option></select><button class="publish">🚀 Upload to YouTube</button></form><p id="r"></p></div></main><script>
async function st(){let e=document.querySelector("#status");try{let d=await (await fetch("/api/status")).json();e.textContent=d.connected?"✅ Connected: "+d.channel.title:"❌ YouTube not connected";e.className=d.connected?"ok":"err"}catch{e.textContent="⚠️ Server unavailable";e.className="err"}}st();
f.onsubmit=async e=>{e.preventDefault();r.textContent="Uploading…";try{let x=await fetch("/api/upload",{method:"POST",body:new FormData(f)}),d=await x.json();if(!x.ok)throw Error(d.error);r.innerHTML='<span class="ok">✅ Uploaded!</span> <a target="_blank" href="'+d.url+'">Open on YouTube</a>';f.reset()}catch(x){r.textContent="❌ "+x.message;r.className="err"}};
</script></body></html>
